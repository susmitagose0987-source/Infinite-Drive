<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unlimited Highway Race</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial}canvas{width:100%;height:100%;display:block}.hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;color:#fff;font-weight:bold;pointer-events:none}.box{background:#0009;padding:10px 14px;border-radius:12px}.start{position:fixed;inset:0;display:grid;place-items:center;background:#000a;color:#fff}.card{text-align:center;background:#151515;padding:30px;border-radius:22px;border:1px solid #444;width:min(92%,520px)}h1{font-size:clamp(34px,7vw,58px);margin:0 0 10px}.card p{color:#bbb;line-height:1.5}button{border:0;border-radius:14px;padding:14px 25px;font-size:18px;font-weight:800;cursor:pointer}.touch{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:18px}.touch button{width:70px;height:60px;background:#000b;color:white;border:1px solid #777;font-size:26px}@media(min-width:800px){.touch{display:none}}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="box">🏁 DISTANCE: <span id="d">0</span> m</div><div class="box">⚡ SPEED: <span id="s">0</span> km/h</div></div><div class="start" id="start"><div class="card"><h1 id="title">UNLIMITED RACE</h1><p id="msg">Endless highway • Infinite traffic • Increasing speed<br>There is no finish line.</p><button id="go">START RACE</button></div></div><div class="touch"><button id="l">◀</button><button id="b">▼</button><button id="r">▶</button></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,roadX,roadW,p,traffic=[],run=false,last=0,dist=0,spd=210,spawn=0,keys={};
function size(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);roadW=Math.min(W*.62,620);roadX=(W-roadW)/2}addEventListener('resize',size);size();
function reset(){p={x:W/2-24,y:H-145,w:48,h:86};traffic=[];dist=0;spd=210;spawn=0}
function car(x0,y,w,h,me=false,n=0){x.fillStyle=me?'#e8edf2':['#e85d5d','#55a8ff','#ffd34e','#9c7cff','#55d68a'][n%5];x.beginPath();x.roundRect(x0,y,w,h,9);x.fill();x.fillStyle='#1c2228';x.fillRect(x0+7,y+15,w-14,h*.25);x.fillRect(x0+7,y+h*.60,w-14,h*.18);x.fillStyle='#fff';x.fillRect(x0+4,y+7,7,8);x.fillRect(x0+w-11,y+7,7,8);x.fillStyle='#f33';x.fillRect(x0+5,y+h-12,7,7);x.fillRect(x0+w-12,y+h-12,7,7)}
function add(){let w=48,h=84,l=Math.floor(Math.random()*3);traffic.push({x:roadX+roadW*(l+.5)/3-w/2,y:-100,w,h,v:70+Math.random()*130,n:Math.floor(Math.random()*5)})}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function end(){run=false;document.getElementById('start').style.display='grid';document.getElementById('title').textContent='RACE OVER';document.getElementById('msg').innerHTML='Distance: <b>'+Math.floor(dist)+' m</b><br>Try again and beat your distance.';document.getElementById('go').textContent='RESTART'}
function loop(t){if(!run)return;let dt=Math.min((t-last)/1000,.04);last=t;spd=Math.min(560,spd+dt*2.3);dist+=spd*dt*.34;if(keys.left)p.x-=370*dt;if(keys.right)p.x+=370*dt;if(keys.brake)spd=Math.max(120,spd-260*dt);p.x=Math.max(roadX+15,Math.min(roadX+roadW-p.w-15,p.x));spawn-=dt;if(spawn<=0){add();spawn=Math.max(.25,1.05-dist/12000)*(.7+Math.random()*.45)}traffic.forEach(q=>q.y+=(spd-q.v)*dt*1.35);traffic=traffic.filter(q=>q.y<H+120);for(const q of traffic)if(hit(p,q)){end();return}x.fillStyle='#668647';x.fillRect(0,0,W,H);x.fillStyle='#777';x.fillRect(roadX-12,0,12,H);x.fillRect(roadX+roadW,0,12,H);x.fillStyle='#292929';x.fillRect(roadX,0,roadW,H);x.fillStyle='#ddd';x.fillRect(roadX+8,0,4,H);x.fillRect(roadX+roadW-12,0,4,H);let dash=(t*spd*.00075)%70;x.fillStyle='#ddd';for(let j=1;j<3;j++){let xx=roadX+roadW*j/3-3;for(let yy=-70+dash;yy<H;yy+=70)x.fillRect(xx,yy,6,38)}traffic.forEach(q=>car(q.x,q.y,q.w,q.h,false,q.n));car(p.x,p.y,p.w,p.h,true);document.getElementById('d').textContent=Math.floor(dist);document.getElementById('s').textContent=Math.floor(spd);requestAnimationFrame(loop)}
function start(){document.getElementById('start').style.display='none';reset();run=true;last=performance.now();requestAnimationFrame(loop)}document.getElementById('go').onclick=start;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowDown'||e.key==='s')keys.brake=true;if(e.key===' '&&!run)start()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowDown'||e.key==='s')keys.brake=false});function hold(id,k){let z=document.getElementById(id);z.onpointerdown=()=>keys[k]=true;z.onpointerup=z.onpointerleave=()=>keys[k]=false}hold('l','left');hold('r','right');hold('b','brake');
</script></body></html>
